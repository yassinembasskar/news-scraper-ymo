services:
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: restores backend/yazaki_news/ (a mongodump snapshot, checked
  # into git) into the mongo container on every `docker compose up`. This is
  # the sync mechanism between machines — dump on one, commit + push, then
  # `git pull` + `docker compose up` on the other pulls it in automatically.
  # NOTE: this DROPS and OVERWRITES the running database every time, so any
  # local changes made since the last dump are lost unless re-dumped first.
  mongo-restore:
    image: mongo:8.0
    volumes:
      - ./backend/yazaki_news:/dump/yazaki_news:ro
    depends_on:
      mongo:
        condition: service_healthy
    command: mongorestore --uri="mongodb://mongo:27017" --drop --db=yazaki_news /dump/yazaki_news
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever MONGO_URI is in backend/.env (which points at
      # localhost, for running the backend outside Docker). Inside Compose's
      # network, services reach each other by service name, not localhost —
      # "mongo" here resolves to the mongo container automatically.
      - MONGO_URI=mongodb://mongo:27017
    volumes:
      # Persistent home for the HuggingFace model cache, independent of any
      # single container/image (see backend/Dockerfile for why it's not
      # baked into the image). Seeded once via `docker cp` from a machine
      # with a working huggingface.co connection; every later `down`/`up`
      # or image rebuild reuses this volume instead of re-downloading.
      - hf-model-cache:/root/.cache/huggingface
    depends_on:
      mongo:
        condition: service_healthy
      mongo-restore:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    environment:
      # Same reasoning as MONGO_URI above — "backend" is the service name,
      # resolvable on Compose's internal network; localhost would mean the
      # frontend container itself.
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
  hf-model-cache: